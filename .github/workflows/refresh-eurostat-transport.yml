name: Refresh Eurostat rail and bus passenger statistics
on:
  push:
    paths:
      - '.github/workflows/refresh-eurostat-transport.yml'
      - 'scripts/import-eurostat-transport.mjs'
  workflow_dispatch:
  schedule:
    - cron: '31 6 12 1,4,7,10 *'
permissions:
  contents: write
concurrency:
  group: eurostat-transport-refresh
  cancel-in-progress: true
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Import annual rail and bus passenger observations
        run: node scripts/import-eurostat-transport.mjs
      - name: Commit Eurostat transport snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add data/eurostat
          if git diff --cached --quiet; then
            echo "No Eurostat transport data changes."
          else
            git commit -m "Import Eurostat rail and bus passenger observations"
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push; then break; fi
              if [ "$attempt" -eq 5 ]; then exit 1; fi
              sleep $((attempt * 3))
            done
          fi
