name: Refresh global Overture travel places
on:
  push:
    paths:
      - '.github/workflows/refresh-overture-places.yml'
      - 'scripts/import-overture-places.py'
  workflow_dispatch:
  schedule:
    - cron: '11 3 20 * *'
permissions:
  contents: write
concurrency:
  group: overture-places-refresh
  cancel-in-progress: true
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install DuckDB
        run: python -m pip install --disable-pip-version-check duckdb==1.4.2
      - name: Extract global Overture travel places
        run: python scripts/import-overture-places.py
      - name: Commit compressed place records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add data/overture
          if git diff --cached --quiet; then
            echo "No Overture data changes."
          else
            git commit -m "Import Overture global travel place records"
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push; then break; fi
              if [ "$attempt" -eq 5 ]; then exit 1; fi
              sleep $((attempt * 3))
            done
          fi
