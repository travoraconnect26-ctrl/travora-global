name: Refresh global transit feed catalog
on:
  push:
    paths:
      - '.github/workflows/refresh-mobility-catalog.yml'
      - 'scripts/import-mobility-catalog.mjs'
  workflow_dispatch:
  schedule:
    - cron: '29 5 1,15 * *'
permissions:
  contents: write
concurrency:
  group: mobility-catalog-refresh
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download global mobility feed catalog
        run: node scripts/import-mobility-catalog.mjs
      - name: Commit catalog snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mobility-database
          if git diff --cached --quiet; then
            echo "No source data changes."
          else
            git commit -m "Refresh global transit feed catalog"
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push; then
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "Push failed after five retries."
                exit 1
              fi
              sleep $((attempt * 3))
            done
          fi
