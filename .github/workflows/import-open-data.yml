name: Import and validate open travel datasets
on:
  push:
    branches: [main]
    paths:
      - 'scripts/import_open_data.py'
      - '.github/workflows/import-open-data.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 5 1 * *'
permissions:
  contents: write
jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Compile importer and validator
        run: python3 -m py_compile scripts/import_open_data.py scripts/build_world.py
          python3 -m json.tool data/world/manifest.json > /dev/null
      - name: Import REST Countries, GeoNames, OurAirports and OpenFlights
        run: python3 scripts/import_open_data.py
      - name: Validate imported shards and size
        run: python3 scripts/build_world.py --check-size
          python3 - <<'PY'
          import json, pathlib
          files=sorted(pathlib.Path('data/world').glob('*.json'))
          assert files, 'No data/world JSON shards found'
          for path in files:
              json.loads(path.read_text(encoding='utf-8'))
          print(f'Validated {len(files)} JSON shards')
          PY
      - name: Commit refreshed datasets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/world
          if git diff --cached --quiet; then
            echo "No dataset changes."
          else
            git commit -m "Refresh attributed open travel datasets"
            git push origin main
          fi
