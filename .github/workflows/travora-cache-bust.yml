name: Apply unified TRAVORA hero design to every HTML page

on:
  push:
    branches: [main]
    paths:
      - "travora-redesign.css"

permissions:
  contents: write

jobs:
  normalize-all-html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove legacy 3D assets and normalize shared stylesheet on every page
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          version = "20261128-hero-unified"
          redesign_link = f'<link rel="stylesheet" href="/travora-redesign.css?v={version}">'

          legacy_css = re.compile(
              r'<link\b(?=[^>]*\bhref\s*=\s*["\'][^"\']*travora-3d(?:-theme)?\.css(?:\?[^"\']*)?["\'])[^>]*>\s*',
              re.IGNORECASE
          )
          redesign_tag = re.compile(
              r'<link\b(?=[^>]*\bhref\s*=\s*["\'][^"\']*travora-redesign\.css(?:\?[^"\']*)?["\'])[^>]*>\s*',
              re.IGNORECASE
          )
          legacy_script = re.compile(
              r'<script\b(?=[^>]*\bsrc\s*=\s*["\'][^"\']*travora-3d-core\.js(?:\?[^"\']*)?["\'])[^>]*>\s*</script>\s*',
              re.IGNORECASE
          )

          changed = []
          for page in sorted(Path(".").rglob("*.html")):
              if any(part.startswith(".") for part in page.parts):
                  continue
              original = page.read_text(encoding="utf-8")
              updated = legacy_css.sub("", original)
              updated = legacy_script.sub("", updated)
              updated = redesign_tag.sub("", updated)

              if re.search(r"</head\s*>", updated, re.IGNORECASE):
                  updated = re.sub(r"</head\s*>", redesign_link + "\n</head>", updated, count=1, flags=re.IGNORECASE)
              else:
                  updated = redesign_link + "\n" + updated

              if updated != original:
                  page.write_text(updated, encoding="utf-8")
                  changed.append(str(page))

          print(f"Normalized {len(changed)} HTML files; target pages discovered recursively.")
          print("\n".join(changed))
          PY
      - name: Verify repository-wide stylesheet and legacy references
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, sys
          pages = [p for p in Path(".").rglob("*.html") if not any(x.startswith(".") for x in p.parts)]
          errors = []
          for p in pages:
              s = p.read_text(encoding="utf-8")
              if s.count("travora-redesign.css?v=20261128-hero-unified") != 1:
                  errors.append(f"{p}: expected exactly one complete stylesheet reference")
              if re.search(r"travora-3d(?:-theme)?\.css", s, re.I):
                  errors.append(f"{p}: legacy 3D stylesheet reference remains")
              if re.search(r"travora-3d-core\.js", s, re.I):
                  errors.append(f"{p}: legacy 3D core script remains")
          print(f"Checked {len(pages)} HTML pages.")
          if errors:
              print("\n".join(errors))
              sys.exit(1)
          PY
      - name: Commit all HTML updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          if git diff --cached --quiet; then
            echo "No HTML updates were necessary."
          else
            git commit -m "Apply unified TRAVORA hero design [skip ci]"
            git push origin main
          fi
