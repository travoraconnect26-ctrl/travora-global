name: Apply TRAVORA UX design to every HTML page

on:
  push:
    branches: [main]
    paths:
      - "travora-redesign.css"
      - "travora-ux.js"

permissions:
  contents: write

concurrency:
  group: travora-layout-rollout
  cancel-in-progress: false

jobs:
  normalize-all-html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Normalize shared stylesheet and UX script across all HTML pages
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          version = "20261128-navfix"
          redesign_link = f'<link rel="stylesheet" href="/travora-redesign.css?v={version}">'
          ux_script = f'<script src="/travora-ux.js?v={version}" defer></script>'

          legacy_css = re.compile(
              r'<link\b(?=[^>]*\bhref\s*=\s*["\'][^"\']*travora-3d(?:-theme)?\.css(?:\?[^"\']*)?["\'])[^>]*>\s*',
              re.IGNORECASE
          )
          redesign_tag = re.compile(
              r'<link\b(?=[^>]*\bhref\s*=\s*["\'][^"\']*travora-redesign\.css(?:\?[^"\']*)?["\'])[^>]*>\s*',
              re.IGNORECASE
          )
          ux_tag = re.compile(
              r'<script\b(?=[^>]*\bsrc\s*=\s*["\'][^"\']*travora-ux\.js(?:\?[^"\']*)?["\'])[^>]*>\s*</script>\s*',
              re.IGNORECASE
          )
          legacy_script = re.compile(
              r'<script\b(?=[^>]*\bsrc\s*=\s*["\'][^"\']*travora-3d-core\.js(?:\?[^"\']*)?["\'])[^>]*>\s*</script>\s*',
              re.IGNORECASE
          )

          changed = []
          for page in sorted(Path(".").rglob("*.html")):
              if any(part.startswith(".") for part in page.parts):
                  continue
              original = page.read_text(encoding="utf-8")
              updated = legacy_css.sub("", original)
              updated = legacy_script.sub("", updated)
              updated = redesign_tag.sub("", updated)
              updated = ux_tag.sub("", updated)
              # Remove obsolete monetization statements from legacy page copy.
              updated = re.sub(r"Advertising is not active yet\.?\s*", "", updated, flags=re.I)
              updated = re.sub(r"links do not currently earn commissions\.?\s*", "", updated, flags=re.I)
              disclosure = ("Some links are affiliate links, which may earn TRAVORA a commission at no extra cost to you. "
                             "Advertising may also appear where enabled, subject to network approval and your privacy choices.")
              updated = re.sub(
                  r'(<div class="travora-footer-bottom"[^>]*>.*)<p[^>]*>.*?</p>(\s*</div>)',
                  r'\1<p>Some links are affiliate links, which may earn TRAVORA a commission at no extra cost to you. Advertising may also appear where enabled, subject to network approval and your privacy choices.</p>\2',
                  updated, count=1, flags=re.S|re.I
              )
              if re.search(r"</head\s*>", updated, re.IGNORECASE):
                  updated = re.sub(
                      r"</head\s*>",
                      redesign_link + "\n" + ux_script + "\n</head>",
                      updated, count=1, flags=re.IGNORECASE
                  )
              else:
                  updated = redesign_link + "\n" + ux_script + "\n" + updated
              if updated != original:
                  page.write_text(updated, encoding="utf-8")
                  changed.append(str(page))
          print(f"Normalized {len(changed)} HTML files.")
          print("\n".join(changed))
          PY
      - name: Verify every page has one current CSS and JS reference
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, sys
          pages = [p for p in Path(".").rglob("*.html") if not any(x.startswith(".") for x in p.parts)]
          errors = []
          for p in pages:
              s = p.read_text(encoding="utf-8")
              if s.count("travora-redesign.css?v=20261128-navfix") != 1:
                  errors.append(f"{p}: expected exactly one current stylesheet reference")
              if s.count("travora-ux.js?v=20261128-navfix") != 1:
                  errors.append(f"{p}: expected exactly one current UX script reference")
              if re.search(r"travora-3d(?:-theme)?\.css", s, re.I):
                  errors.append(f"{p}: legacy 3D stylesheet remains")
              if re.search(r"travora-3d-core\.js", s, re.I):
                  errors.append(f"{p}: legacy 3D core script remains")
          print(f"Checked {len(pages)} HTML pages.")
          if errors:
              print("\n".join(errors))
              sys.exit(1)
          PY
      - name: Commit all HTML updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          if git diff --cached --quiet; then
            echo "No HTML updates were necessary."
          else
            git commit -m "Apply TRAVORA UX rollout to every HTML page [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
