name: Refresh World Bank passenger statistics
on:
  push:
    paths:
      - '.github/workflows/refresh-worldbank.yml'
      - 'scripts/import-worldbank-statistics.mjs'
  workflow_dispatch:
  schedule:
    - cron: '13 5 1 */3 *'
permissions:
  contents: write
concurrency:
  group: worldbank-statistics-refresh
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download public World Bank indicators
        run: node scripts/import-worldbank-statistics.mjs
      - name: Commit refreshed statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/worldbank
          if git diff --cached --quiet; then
            echo "No source data changes."
          else
            git commit -m "Refresh World Bank passenger statistics"
            git pull --rebase origin main
            git push
          fi
