name: Refresh Overture settlements and divisions
on:
  push:
    paths:
      - '.github/workflows/refresh-overture-divisions.yml'
      - 'scripts/import-overture-divisions.py'
  workflow_dispatch:
  schedule:
    - cron: '27 4 21 * *'
permissions:
  contents: write
concurrency:
  group: overture-divisions-refresh
  cancel-in-progress: true
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install DuckDB
        run: python -m pip install --disable-pip-version-check duckdb==1.4.2
      - name: Import country-balanced settlement records
        run: python scripts/import-overture-divisions.py
      - name: Commit settlement extract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add data/overture/settlements.json.gz data/overture/settlements-metadata.json
          git commit -m "Import Overture country and settlement records" || echo "No data changes."
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push; then break; fi
            if [ "$attempt" -eq 5 ]; then exit 1; fi
            sleep $((attempt * 3))
          done
