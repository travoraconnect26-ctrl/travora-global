name: Refresh OurAirports global dataset
on:
  push:
    paths:
      - '.github/workflows/refresh-ourairports.yml'
      - 'scripts/import-ourairports.mjs'
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download public-domain airport datasets
        run: node scripts/import-ourairports.mjs
      - name: Commit refreshed source files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ourairports
          if git diff --cached --quiet; then
            echo "No source data changes."
          else
            git commit -m "Refresh global OurAirports datasets"
            git push
          fi
