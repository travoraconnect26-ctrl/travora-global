name: Refresh Wikidata travel directories
on:
  push:
    paths:
      - '.github/workflows/refresh-wikidata-travel.yml'
      - 'scripts/import-wikidata-travel.mjs'
  workflow_dispatch:
  schedule:
    - cron: '43 4 5 * *'
permissions:
  contents: write
concurrency:
  group: wikidata-travel-refresh
  cancel-in-progress: true
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Import Wikidata travel records
        run: node scripts/import-wikidata-travel.mjs
      - name: Commit data snapshot
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/wikidata
          if git diff --cached --quiet; then
            echo "No source data changes."
          else
            git commit -m "Import Wikidata hotels cruise ships rentals and attractions"
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push; then break; fi
              if [ "$attempt" -eq 5 ]; then exit 1; fi
              sleep $((attempt * 3))
            done
          fi
