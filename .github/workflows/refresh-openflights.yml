name: Refresh OpenFlights aviation reference data
on:
  push:
    paths:
      - '.github/workflows/refresh-openflights.yml'
      - 'scripts/import-openflights.mjs'
  workflow_dispatch:
  schedule:
    - cron: '41 4 1 * *'
permissions:
  contents: write
concurrency:
  group: openflights-data-refresh
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download OpenFlights route and aircraft reference data
        run: node scripts/import-openflights.mjs
      - name: Commit refreshed source files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/openflights
          if git diff --cached --quiet; then
            echo "No source data changes."
          else
            git commit -m "Refresh OpenFlights aviation reference data"
            git pull --rebase origin main
            git push
          fi
